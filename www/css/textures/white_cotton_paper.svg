<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Micro-Grain Fine Art Cotton Rag Paper Filter -->
    <filter id="microCottonPaper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise" stitchTiles="stitch"/>
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.4" result="light">
        <feDistantLight azimuth="55" elevation="65" />
      </feDiffuseLighting>
      <feComponentTransfer in="light" result="brightened">
        <feFuncR type="linear" slope="0.98" intercept="0.02"/>
        <feFuncG type="linear" slope="0.98" intercept="0.02"/>
        <feFuncB type="linear" slope="0.98" intercept="0.02"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="brightened" />
    </filter>
  </defs>

  <!-- Clean Fine-Art Cotton Rag Paper Base -->
  <rect width="100%" height="100%" fill="#FCF8F9" filter="url(#microCottonPaper)" />
</svg>